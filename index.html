  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var p = JSON.parse(localStorage.getItem('a2:prefs') || '{}');
      if (p.theme === 'dark' || p.theme === 'light') document.documentElement.setAttribute('data-theme', p.theme);
    } catch (e) {}
  </script>
